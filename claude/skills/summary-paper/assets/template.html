<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --ground:#EDEFF0; --surface:#FFFFFF; --surface-2:#F5F7F8;
  --ink:#141A1D; --ink-2:#4C575C; --ink-3:#76838A;
  --line:#D2D9DC; --line-2:#B4BFC3;
  --a:#0A6C77; --a-soft:#DCEDEF;
  --b:#8F5D0D; --b-soft:#F5E8CF;
  --flag:#9C2A24; --flag-soft:#F3DDDB;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111517; --surface:#191E21; --surface-2:#20272A;
    --ink:#E7ECEE; --ink-2:#A6B1B6; --ink-3:#7C898E;
    --line:#2C3438; --line-2:#424C51;
    --a:#4ECAD5; --a-soft:#0E3236;
    --b:#E2B155; --b-soft:#362A11;
    --flag:#EF8A80; --flag-soft:#3A1917;
  }
}
:root[data-theme="dark"]{
  --ground:#111517; --surface:#191E21; --surface-2:#20272A;
  --ink:#E7ECEE; --ink-2:#A6B1B6; --ink-3:#7C898E;
  --line:#2C3438; --line-2:#424C51;
  --a:#4ECAD5; --a-soft:#0E3236;
  --b:#E2B155; --b-soft:#362A11;
  --flag:#EF8A80; --flag-soft:#3A1917;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","NanumGothic",system-ui,sans-serif;
  font-size:16.5px;line-height:1.72}
.wrap{max-width:62rem;margin-inline:auto;padding:2.5rem 1.5rem 6rem}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:0 0 1rem;text-wrap:balance}
h2{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin:3rem 0 .8rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h2.paces::before{content:attr(data-letter);display:inline-block;width:2rem;margin-right:.6rem;
  font-family:"IBM Plex Mono",Menlo,monospace;font-size:1.5rem;color:var(--a);vertical-align:-.05em}
h3{font-size:1.05rem;font-weight:600;margin:1.6rem 0 .5rem}
p,li{max-width:44rem}
a{color:var(--a)}
code{font-family:"IBM Plex Mono",Menlo,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .35em;border-radius:3px}
pre{background:var(--surface-2);padding:1rem;overflow-x:auto;border:1px solid var(--line)}
pre code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;min-width:24rem;background:var(--surface);border:1px solid var(--line-2)}
th,td{padding:.55rem .9rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:"IBM Plex Mono",Menlo,monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
figure{margin:1.6rem 0;padding:1rem;background:var(--surface);border:1px solid var(--line-2)}
figure svg.fig,figure img.fig{display:block;max-width:100%;height:auto;margin-inline:auto}
figure svg.fig{width:100%}
figcaption{margin-top:.7rem;font-size:.92rem;color:var(--ink-2)}
.verdict{display:inline-block;font-family:"IBM Plex Mono",Menlo,monospace;font-size:.8rem;font-weight:600;
  letter-spacing:.08em;padding:.2rem .8rem;border-radius:999px;margin-bottom:.5rem}
.verdict-yes{color:var(--a);background:var(--a-soft)}
.verdict-partial{color:var(--b);background:var(--b-soft)}
.verdict-no{color:var(--flag);background:var(--flag-soft)}
blockquote{margin:1.2rem 0;padding:.8rem 1.2rem;border-left:3px solid var(--a);background:var(--surface);color:var(--ink-2)}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
@media print{body{background:#fff;color:#000}.wrap{max-width:none;padding:0}figure{break-inside:avoid;border:none}}
</style>
</head>
<body>
<main class="wrap">
{{BODY}}
</main>
</body>
</html>
